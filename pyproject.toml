[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentifyme-acms"
version = "0.1.0"
description = "AgentifyMe Cloud Management System control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "ldap3>=2.9,<3",
  "anyio>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "httpx>=0.27,<1",
  "aiosqlite>=0.20,<1",
  "pgserver>=0.1,<1; sys_platform == 'linux'",
]

[tool.setuptools]
packages = ["acms", "acms.ui"]

[tool.setuptools.package-data]
"acms.ui" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
