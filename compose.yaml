# Local PostgreSQL for ACMS development and integration tests (ADR-0007).
# Usage:
#   export ACMS_POSTGRES_PASSWORD='<set a local dev password>'
#   docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    container_name: acms-postgres
    environment:
      POSTGRES_USER: acms
      POSTGRES_PASSWORD: ${ACMS_POSTGRES_PASSWORD?set ACMS_POSTGRES_PASSWORD in your shell environment}
      POSTGRES_DB: acms
    ports:
      - "5432:5432"
    volumes:
      - acms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acms -d acms"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  acms-pgdata:
