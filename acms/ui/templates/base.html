<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ACMS{% endblock %}</title>
  <link rel="stylesheet" href="/ui/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/ui/">ACMS</a>
    {% if user %}
    <nav>
      <a href="/ui/">Home</a>
      <a href="/ui/work/board">Work</a>
      <a href="/ui/agents">Agents</a>
      <a href="/ui/products">Products</a>
      <a href="/ui/usage">Usage</a>
      <a href="/ui/inbox">Inbox</a>
      <a href="/ui/artifacts">Artifacts</a>
      <a href="/ui/attention">Attention</a>
      <a href="/ui/system">System</a>
    </nav>
    <form class="global-search" method="get" action="/ui/search">
      <input type="search" name="q" placeholder="Search anything… (Work/Artifact/Agent/Project/Product/Jira)"
             value="{{ request.query_params.get('q') or '' }}" aria-label="Global search">
      <button type="submit" aria-label="Search">🔍</button>
    </form>
    <div class="session">
      <span class="who">{{ user.username }}</span>
      <span class="role role-{{ user.role }}">{{ user.role }}</span>
      <a href="/ui/logout">Log out</a>
    </div>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>ACMS v{{ version }} &middot; build {{ git_sha_short }}</span>
    <span>internal only</span>
  </footer>
</body>
</html>
