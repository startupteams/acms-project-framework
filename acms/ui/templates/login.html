{% extends "base.html" %}
{% block title %}ACMS Login{% endblock %}
{% block content %}
<section class="login-card">
  <h1>ACMS Sign in</h1>
  {% if login_disabled %}
  <p class="notice warn">Web login is disabled: the server has no session signing secret configured.</p>
  {% else %}
  {% if error %}<p class="notice warn">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login" class="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  {% endif %}
</section>
{% endblock %}
