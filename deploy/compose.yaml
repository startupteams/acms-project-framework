# ACMS first live deployment stack (plan §4/§9): acms-app + postgres + reverse-proxy.
# Run from the production VM with the external secret file:
#   docker compose -f deploy/compose.yaml --env-file /opt/acms/.env up -d
#
# Secrets live ONLY in /opt/acms/.env (0600) — never committed (plan §10).
# PostgreSQL has no published ports: reachable only inside the Compose network.
name: acms

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: acms
      POSTGRES_PASSWORD: ${ACMS_POSTGRES_PASSWORD:?set ACMS_POSTGRES_PASSWORD in /opt/acms/.env}
      POSTGRES_DB: acms
    volumes:
      - acms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acms -d acms"]
      interval: 5s
      timeout: 3s
      retries: 20

  acms-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        ACMS_BUILD_GIT_SHA: ${ACMS_BUILD_GIT_SHA:-unknown}
        ACMS_BUILD_TIME: ${ACMS_BUILD_TIME:-unknown}
    image: acms-app:${ACMS_APP_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      ACMS_ADMIN_TOKEN: ${ACMS_ADMIN_TOKEN:?set ACMS_ADMIN_TOKEN in /opt/acms/.env}
      ACMS_DATABASE_URL: postgresql://acms:${ACMS_POSTGRES_PASSWORD}@postgres:5432/acms
      ACMS_ENVIRONMENT: ${ACMS_ENVIRONMENT:-production}
      # Human web login (plan §6) — session + LLDAP settings.
      ACMS_SESSION_SECRET: ${ACMS_SESSION_SECRET:?set ACMS_SESSION_SECRET in /opt/acms/.env}
      ACMS_SESSION_LIFETIME_MINUTES: ${ACMS_SESSION_LIFETIME_MINUTES:-480}
      ACMS_SESSION_COOKIE_SECURE: "true"
      # Server Manager integration (JINT-001): base URL of the machine API + scoped token (§11).
      ACMS_SERVER_MANAGER_BASE_URL: ${ACMS_SERVER_MANAGER_BASE_URL:-}
      ACMS_SERVER_MANAGER_TOKEN: ${ACMS_SERVER_MANAGER_TOKEN:-}
      # Agent Bridge targets (slice 3+4 plan §15): JSON list of {agent_id, base_url, api_key}.
      ACMS_BRIDGE_TARGETS_JSON: ${ACMS_BRIDGE_TARGETS_JSON:-}
      # Work Item creation authority (ADR-0011 Accepted): Executive Agent IDs.
      ACMS_EXECUTIVE_AGENT_IDS: ${ACMS_EXECUTIVE_AGENT_IDS:-}
      # ADR-0012 completion callback: scoped token + advertised base URL for
      # worker terminal-result delivery (protocol hint in dispatch instructions).
      ACMS_CALLBACK_TOKEN: ${ACMS_CALLBACK_TOKEN:-}
      ACMS_CALLBACK_BASE_URL: ${ACMS_CALLBACK_BASE_URL:-}
      ACMS_CALLBACK_RECONCILE_SECONDS: ${ACMS_CALLBACK_RECONCILE_SECONDS:-300}
      ACMS_LDAP_URL: ${ACMS_LDAP_URL:?set ACMS_LDAP_URL in /opt/acms/.env}
      ACMS_LDAP_BIND_DN: ${ACMS_LDAP_BIND_DN:-}
      ACMS_LDAP_BIND_PASSWORD: ${ACMS_LDAP_BIND_PASSWORD:-}
      ACMS_LDAP_USER_BASE: ${ACMS_LDAP_USER_BASE:?set ACMS_LDAP_USER_BASE in /opt/acms/.env}
      ACMS_LDAP_USER_FILTER: ${ACMS_LDAP_USER_FILTER:-(uid={username})}
      ACMS_LDAP_GROUP_ADMIN: ${ACMS_LDAP_GROUP_ADMIN:-}
      ACMS_LDAP_GROUP_WORKER: ${ACMS_LDAP_GROUP_WORKER:-}
      ACMS_LDAP_GROUP_OBSERVER: ${ACMS_LDAP_GROUP_OBSERVER:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Port stays inside the Compose network only; the reverse proxy is the
    # single HTTPS entrypoint (plan §9).

  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Directory mount (feature-delivery plan §6 + live-drill lesson 2026-09-26):
      # a single-file bind mount pins the inode, so swapping the file on disk is
      # invisible to the container and a HUP reload keeps serving the stale
      # config. With a directory mount, in-place edits (same inode) are seen
      # immediately. nginx.maintenance.conf.template is not matched by the
      # conf.d/*.conf include glob — common.sh copies it over nginx.conf to
      # activate maintenance mode.
      - ./reverse-proxy:/etc/nginx/conf.d:ro
      # Operator-provided internal-CA certificate + key (plan §7).
      # Expected files: acms.crt (full chain) and acms.key, 0600.
      - /opt/acms/tls:/etc/nginx/tls:ro
    depends_on:
      - acms-app

volumes:
  acms-pgdata:
