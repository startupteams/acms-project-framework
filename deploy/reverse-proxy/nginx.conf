# ACMS reverse proxy (plan §7/§9/§12): HTTPS termination, internal-only source
# networks, standard forwarded headers, SSE-compatible streaming settings.
#
# TLS material is operator-provisioned at /etc/nginx/tls (mounted from
# /opt/acms/tls): acms.crt = full chain, acms.key = private key (0600).

server {
    listen 80;
    listen [::]:80;
    # No auth content on plaintext — redirect everything to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name acms.miam.home.arpa;

    ssl_certificate     /etc/nginx/tls/acms.crt;
    ssl_certificate_key /etc/nginx/tls/acms.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:ACMS:10m;

    # Internal-only (plan §12): 10.0.10.0/24 and 10.0.20.0/24.
    allow 10.0.10.0/24;
    allow 10.0.20.0/24;
    deny  all;

    # Modest body limit; ACMS accepts small JSON payloads today.
    client_max_body_size 1m;

    location / {
        proxy_pass http://acms-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        # Keep SSE/WebSocket-compatible streaming paths alive (plan §9).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
